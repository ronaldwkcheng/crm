              - column: { name: display_name, value: "First Name" }
              - column: { name: internal_name, value: "firstName" }
              - column: { name: summary, value: "Customer's first name" }
              - column: { name: created_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: last_updated_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: version, valueNumeric: 0 }
              - column: { name: property_type, value: "STRING" }
              - column: { name: visibility, value: "VISIBLE" }
              - column: { name: is_required, valueBoolean: true }
        - insert:
            tableName: schema_property
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: schema_definition_id, valueNumeric: 1 }
              - column: { name: display_name, value: "Last Name" }
              - column: { name: internal_name, value: "lastName" }
              - column: { name: summary, value: "Customer's last name" }
              - column: { name: created_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: last_updated_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: version, valueNumeric: 0 }
              - column: { name: property_type, value: "STRING" }
              - column: { name: visibility, value: "VISIBLE" }
              - column: { name: is_required, valueBoolean: true }
        - insert:
