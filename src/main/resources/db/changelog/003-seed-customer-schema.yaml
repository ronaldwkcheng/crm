databaseChangeLog:
  - changeSet:
      id: 003-01-seed-customer-schema
      author: ronald
      changes:
        - insert:
            tableName: schema_definition
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: display_name, value: "Customer" }
              - column: { name: internal_name, value: "customer" }
              - column: { name: summary, value: "An individual customer" }
              - column: { name: description, value: "Pre-built reference schema representing an individual customer, modeled after Salesforce Contact and HubSpot Contact." }
              - column: { name: created_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: last_updated_date, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: version, valueNumeric: 0 }
        - sql:
            sql: ALTER TABLE schema_definition ALTER COLUMN id RESTART WITH 2;

  - changeSet:
      id: 003-02-seed-customer-properties
      author: ronald
      changes:
        - insert:
            tableName: schema_property
