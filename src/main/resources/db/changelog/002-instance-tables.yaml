databaseChangeLog:
  - changeSet:
      id: 002-01-schema-instance
      author: ronald
      changes:
        - createTable:
            tableName: schema_instance
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: schema_definition_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_instance_schema, references: schema_definition(id) } }
              - column: { name: created_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: last_updated_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createIndex:
            indexName: ix_schema_instance_schema_definition
            tableName: schema_instance
            columns:
              - column: { name: schema_definition_id }

  - changeSet:
      id: 002-02-instance-property-value
      author: ronald
      changes:
        - createTable:
            tableName: instance_property_value
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: instance_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_value_instance, references: schema_instance(id) } }
              - column: { name: property_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_value_property, references: schema_property(id) } }
              # Single canonical-string column for every property type (see InstancePropertyValue's
              # javadoc); a SELECT_MULTIPLE property's selections are comma-joined into one row here
              # rather than spread across multiple rows. Named property_value, not value: VALUE is a
              # reserved word in H2 (and several other SQL dialects).
              - column: { name: property_value, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: last_updated_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        # Covers findByInstance/findByInstanceIn/deleteByInstance (instance_id, the leading column)
        # and deleteByInstanceAndProperty (both columns) in one index.
        - createIndex:
            indexName: ix_ipv_instance_property
            tableName: instance_property_value
            columns:
              - column: { name: instance_id }
              - column: { name: property_id }
        # Supports EQ filters and the (property_id, property_value) lookup pattern. Filters/sorts/reports
        # using GT/GTE/LT/LTE compare a CAST(property_value AS ...) expression (see InstanceEavQuerySupport),
        # which this plain index on the raw text column cannot accelerate - a deliberate simplicity/index
        # tradeoff that comes with collapsing 5 typed columns into 1.
        - createIndex:
            indexName: ix_ipv_property_value
            tableName: instance_property_value
            columns:
              - column: { name: property_id }
              - column: { name: property_value }

  - changeSet:
      id: 002-03-instance-association
      author: ronald
      changes:
        - createTable:
            tableName: instance_association
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: association_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_link_association, references: schema_association(id) } }
              - column: { name: source_instance_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_link_source, references: schema_instance(id) } }
              - column: { name: target_instance_id, type: BIGINT, constraints: { nullable: false, foreignKeyName: fk_link_target, references: schema_instance(id) } }
              - column: { name: created_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: last_updated_date, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: instance_association
            columnNames: association_id, source_instance_id, target_instance_id
            constraintName: uq_link_association_source_target
        # findByAssociationAndSourceInstance/countByAssociationAndSourceInstance are covered by the
        # leading two columns of the unique constraint above; this covers the target-side equivalents,
        # since target_instance_id is the unique constraint's third (non-leading) column.
        - createIndex:
            indexName: ix_instance_association_target
            tableName: instance_association
            columns:
              - column: { name: association_id }
              - column: { name: target_instance_id }
